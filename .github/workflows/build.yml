name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Flutter explicitly. Flet is asking for a very new version (likely from main/master channel)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master # Access latest versions
          
      - name: Install Flet
        run: pip install flet

      - name: Build APK
        # Pipe 'yes' to automatically accept any prompts
        run: |
          yes | flet build apk --project "Calculadora Crypto" --org "com.antigravity.crypto" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
