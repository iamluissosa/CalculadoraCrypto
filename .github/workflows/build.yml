name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Flutter explicitly to avoid Flet asking for permission interactively
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.1' # Pinning a recent stable version compatible with Flet
          
      - name: Install Flet
        run: pip install flet

      - name: Build APK
        # Use --no-rich usage if possible or just rely on pre-installed flutter
        run: |
          flet build apk --project "Calculadora Crypto" --org "com.antigravity.crypto" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
